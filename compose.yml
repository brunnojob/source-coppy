services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      BS_DATABASE: /data/business.sqlite3
      BS_CORS_ORIGINS: ${BS_CORS_ORIGINS:-https://brunnojob.github.io,http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - business-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    security_opt:
      - no-new-privileges:true
volumes:
  business-data:
